[pytest]
testpaths       = tests
python_files    = test_*.py
python_classes  = Test*
python_functions= test_*
addopts         = -v --tb=short --no-header -ra --strict-markers
filterwarnings  =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PendingDeprecationWarning

# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests that touch real subprocesses
    gui: marks tests requiring a display
    llm: marks tests that require a real LLM endpoint
